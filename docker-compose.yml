# Local development: Postgres, and optionally the API in the same image Coolify runs.
#
#   npm run db:up                         # Postgres only (run the API with `npm run api`)
#   docker compose --profile api up       # Postgres + API container
#
# The API container runs migrations on start, like a Coolify deploy.

name: clothhub

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: clothhub
      POSTGRES_USER: clothhub
      POSTGRES_PASSWORD: clothhub
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clothhub -d clothhub"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    profiles: ["api"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://clothhub:clothhub@postgres:5432/clothhub
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "node dist/migrate.js && node dist/index.js"]

volumes:
  postgres-data:
