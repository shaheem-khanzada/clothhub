# Local development: MySQL 8.4 (the version the scraper's server runs), and
# optionally the API in the same image Coolify runs.
#
#   npm run db:up                         # MySQL only (run the API with `npm run api`)
#   docker compose --profile api up       # MySQL + API container
#
# Databases on this server:
#   clothhub_dev            ClothHub's tables (created here)
#   clothhub_test*          created and dropped by the API's integration tests
#   scraper                 optional: a scraper dump, loaded with scripts/load-scraper-dump.sh

name: clothhub

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: clothhub_dev
      MYSQL_USER: clothhub
      MYSQL_PASSWORD: clothhub
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    profiles: ["api"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: mysql://clothhub:clothhub@mysql:3306/clothhub_dev
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy
    command: ["sh", "-c", "node dist/migrate.js && node dist/index.js"]

volumes:
  mysql-data:
