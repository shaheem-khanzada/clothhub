name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=3s --health-retries=20

    env:
      # The API's integration tests create and drop their own databases.
      TEST_DATABASE_URL: mysql://root:root@127.0.0.1:3306

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: API tests (unit + integration against MySQL)
        run: npm test -w @clothhub/api

      - name: Mobile tests
        run: npm test -w @clothhub/mobile -- --ci

      - name: API build
        run: npm run build -w @clothhub/api

      - name: Landing lint
        run: npm run lint -w @clothhub/landing

      - name: Landing build
        run: npm run build -w @clothhub/landing
